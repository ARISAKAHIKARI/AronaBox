<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: blob: pet-model:; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' blob: data:; connect-src 'self' pet-model:"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿罗娜桌边聊天</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pet.css"></head>
