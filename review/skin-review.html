<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>2.3.0 皮肤与动作对照</title>
<link rel="stylesheet" href="../style.css"><style>
body{display:block;margin:0;padding:24px;background:#eef5fa;color:#233750;font:15px/1.6 "Microsoft YaHei",sans-serif;height:auto;overflow:auto}main{max-width:1120px;margin:auto}h1{font-size:25px}nav{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}select,button{padding:9px;border:1px solid #bdcede;border-radius:8px;background:white;color:#233750}section{display:grid;grid-template-columns:1fr 1fr;gap:24px}.stage,.notes{background:white;border-radius:20px;padding:20px}.stage{display:flex;justify-content:center;align-items:center;min-height:490px}#mascot.sprite{position:relative;inset:auto;display:block;width:310px;height:470px;background-size:auto;margin:0;filter:none}#references{display:flex;gap:12px;flex-wrap:wrap}#references img{height:230px;width:auto;max-width:100%;object-fit:contain;border-radius:8px}p{margin:10px 0}a{color:#2679b5}@media(max-width:700px){section{grid-template-columns:1fr}}
</style><main><h1>角色、动作与参照图</h1><p>选择角色后可逐个查看动作，或开启待机预览。角色素材为二创重绘；参照性质在右侧注明。</p>
<nav><select id="skin"></select><select id="action"></select><button id="next">下一个动作</button><button id="auto">开启待机预览</button></nav>
<section><div class="stage"><div id="mascot" class="sprite" data-mood="idle"></div></div><div class="notes"><h2 id="title"></h2><p id="kind"></p><p id="note"></p><div id="references"></div><p><a href="../逐动作参考清单.md">逐动作参考清单</a> · <a href="../皮肤参考与动作说明.md">来源说明</a></p></div></section>
<p>Q 版与立绘版均有 12 个动作。手动模式可停留观察；待机预览包含呼吸、轻微转向、摇摆和当前角色的小动作。</p></main>
<script src="../skins.js"></script><script src="../skin-frames.js"></script><script src="../skin-action-references.js"></script><script src="../chat-ui.js"></script>
<script>window.desk={on(){}};let automatic=false;const pet=document.querySelector('#mascot'),skin=document.querySelector('#skin'),action=document.querySelector('#action');
// Paths in the catalog are relative to the application root.
for(const s of Object.values(PetSkins.catalog)){s.file='../'+s.file;skin.add(new Option(s.name,s.id))}
function showReference(){const s=PetSkins.catalog[skin.value],key=PetSkins.pose({builtinSkin:s.id},pet.dataset.mood),r=SkinActionReferences[s.id][key];action.value=key;document.querySelector('#title').textContent=s.name+' · '+r.label;document.querySelector('#kind').textContent=r.type;document.querySelector('#note').textContent=r.note;const box=document.querySelector('#references');box.replaceChildren();for(const file of r.images){const a=document.createElement('a');a.href='../reference-materials/'+file;a.target='_blank';const img=document.createElement('img');img.src=a.href;img.alt=file;a.append(img);box.append(a)}}
function choose(){ChatUI.skin(pet,{builtinSkin:skin.value});action.replaceChildren(...Object.entries(PetSkins.catalog[skin.value].actions).map(([k,v])=>new Option(v,k)));manual('idle')}
function manual(mood){PetIdle.touch(pet,automatic?8000:86400000);pet.dataset.mood=mood;showReference()}
skin.onchange=choose;action.onchange=()=>manual(action.value);document.querySelector('#next').onclick=()=>{action.selectedIndex=(action.selectedIndex+1)%action.options.length;manual(action.value)};
document.querySelector('#auto').onclick=e=>{automatic=!automatic;e.target.textContent=automatic?'停止待机预览':'开启待机预览';PetIdle.touch(pet,automatic?0:86400000);pet.dataset.mood='idle'};new MutationObserver(showReference).observe(pet,{attributes:true,attributeFilter:['data-mood']});
</script><script src="../pet-idle.js"></script><script>choose()</script></html>
