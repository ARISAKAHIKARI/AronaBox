<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="popup.css"></head><body><h3>✧ 阿罗娜网页桥接</h3><p>先打开并登录聊天页。本扩展会在你选中的页面输入消息，并读取可见回复。</p><label>桌宠设置中的连接码<input id="token" type="password" autocomplete="off"></label><label>当前页面模型<select id="provider"><option value="chatgpt">ChatGPT / 代理站</option><option value="doubao">无线豆包</option><option value="gemini">Gemini</option><option value="deepseek">DeepSeek</option></select></label><details><summary>页面适配（识别失败时填写）</summary><p>填写 CSS 选择器。回复选择器必须只匹配模型回复，不包含你的提问。</p><label>输入框<input id="input-selector" placeholder="默认自动识别"></label><label>发送按钮<input id="send-selector" placeholder="默认自动识别"></label><label>模型回复<input id="reply-selector" placeholder="内网站可按实际页面填写"></label><label>停止按钮<input id="stop-selector" placeholder="可选，用于检测生成状态"></label></details><label><input id="keep-active" type="checkbox" checked>保持后台渲染</label><p>仅对连接的模型页启用浏览器调试连接，切页后继续渲染。浏览器会显示调试提示；断开模型后释放。</p><label><input id="http-reply" type="checkbox">HTTP 回复直读（实验）</label><p>读取本次消息完成后的响应，不依赖页面渲染。未知协议自动回退网页采集，仍需保持登录。</p><label><input id="keep-window" type="checkbox">独立接收窗口（备用）</label><p>连接时把当前页移到独立窗口，原窗口可自由切页。接收窗口请勿最小化。</p><button id="connect">连接当前页面</button><button id="diagnose">检测当前页面</button><button id="disconnect">断开当前模型</button><p id="status" role="status"></p><script src="popup.js"></script></body></html>
